kind = "web"
previewPath = "/"
title = "Sendlet"
version = "1.0.0"
id = "artifacts/sendlet"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22162

[services.development]
run = "pnpm --filter @workspace/sendlet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sendlet", "run", "build" ]
publicDir = "artifacts/sendlet/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22162"
BASE_PATH = "/"
